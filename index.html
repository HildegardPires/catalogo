
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>PMW Variedades</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body class="bg-light">


<!-- ========================================================= -->
<!-- CABEÇALHO -->
<!-- ========================================================= -->

<header class="bg-success text-white shadow-sm sticky-top">

    <div class="container py-4">

        <p class="text-center mb-4">
            Entrega grátis em Taquaralto e Região
        </p>


        <!-- PESQUISA -->

        <div class="busca-com-logo">
            <img
                src="img/logo.png"
                alt="Logomarca PMW Variedades"
                class="logo-busca">

            <input
                class="form-control form-control-lg"
                id="pesquisa"
                type="text"
                placeholder="Pesquisar produtos...">
        </div>


        <!-- BOTÃO CATEGORIAS - CELULAR -->

        <button
            class="btn btn-light mt-3 d-lg-none w-100"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#menuCategorias">

            Categorias

        </button>

    </div>

</header>



<!-- ========================================================= -->
<!-- OFFCANVAS - CELULAR -->
<!-- ========================================================= -->

<div
    class="offcanvas offcanvas-start"
    tabindex="-1"
    id="menuCategorias">


    <div class="offcanvas-header bg-success text-white">

        <h5 class="offcanvas-title">

            Categorias

        </h5>


        <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="offcanvas">
        </button>

    </div>


    <div
        class="offcanvas-body"
        id="categoriasMobile">

        <!-- Categorias carregadas pelo JavaScript -->

    </div>

</div>



<!-- ========================================================= -->
<!-- CONTEÚDO -->
<!-- ========================================================= -->

<div class="container my-4">


    <div class="row">


        <!-- ================================================= -->
        <!-- MENU LATERAL - DESKTOP -->
        <!-- ================================================= -->

        <aside class="col-lg-3 d-none d-lg-block">


            <div class="card shadow-sm border-0 sticky-top"
                 style="top: 140px;">


                <div class="card-body">


                    <h5 class="fw-bold mb-3">

                        Categorias

                    </h5>


                    <div
                        id="categorias"
                        class="list-group list-group-flush">

                        <!-- Categorias carregadas pelo JavaScript -->

                    </div>


                </div>

            </div>


        </aside>



        <!-- ================================================= -->
        <!-- PRODUTOS -->
        <!-- ================================================= -->

        <main class="col-lg-9">


            <!-- CATEGORIA ATUAL -->

            <div
                class="d-flex justify-content-between align-items-center mb-3">


                <h4
                    id="categoriaAtual"
                    class="fw-bold mb-0">

                    Todos os produtos

                </h4>


                <span
                    id="contadorProdutos"
                    class="badge bg-success">

                    0 produtos

                </span>

            </div>


            <!-- PRODUTOS -->

            <div
                id="produtos"
                class="row g-4">

            </div>


            <!-- SEM PRODUTOS -->

            <div
                id="semProdutos"
                class="text-center py-5 d-none">

                <div class="fs-1">
                    🔍
                </div>

                <h5>
                    Nenhum produto encontrado
                </h5>

                <p class="text-muted">
                    Tente outra categoria ou pesquisa.
                </p>

            </div>


        </main>


    </div>

</div>

<!-- ========================================================= -->
<!-- MODAL DA IMAGEM -->
<!-- ========================================================= -->

<div
    class="modal fade"
    id="modalImagem"
    tabindex="-1">

    <div class="modal-dialog modal-dialog-centered modal-xl">

        <div class="modal-content bg-dark border-0">

            <div class="modal-header border-0">

                <h5
                    class="modal-title text-white"
                    id="tituloImagem">
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body text-center">

                <img
                    id="imagemModal"
                    class="img-fluid rounded"
                    style="
                        max-height:85vh;
                        object-fit:contain;
                    ">

            </div>

        </div>

    </div>

</div>

<!-- BOOTSTRAP -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

<!-- SEU JAVASCRIPT -->
<script src="script.js"></script>



</body>

</html>
